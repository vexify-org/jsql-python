[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsql-neo"
version = "6.8.7"
description = "Python client and CLI for JSQL-NEO (Node.js backend)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "vexify" }]
keywords = ["jsql", "json", "database", "sql", "node", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]

[project.scripts]
jsql = "jsql_neo.cli:main"

[project.urls]
Homepage = "https://github.com/vexify-org/jsql-python"
Repository = "https://github.com/vexify-org/jsql-python"
Issues = "https://github.com/vexify-org/jsql-python/issues"

[tool.setuptools]
packages = ["jsql_neo"]
include-package-data = true

[tool.setuptools.package-data]
jsql_neo = ["_bridge.js", "py.typed"]
